<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>தமிழ் உயிர்ச் செழிழ்கள் (TUC) — Grand Curtain Reveal</title>

  <!-- Google Fonts: Crisp Tamil Typography + Regal Display Accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+Tamil:wght@600;700;800;900&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* =========================================================================
       ROOT DESIGN TOKENS & BASE STAGE SETUP
       ========================================================================= */
    :root {
      --velvet-darkest: #260105;
      --velvet-dark: #4b030a;
      --velvet-mid: #7d0613;
      --velvet-bright: #a30b1c;
      --velvet-highlight: #c4182b;
      --gold-light: #fff6d6;
      --gold-bright: #f8d47c;
      --gold-mid: #d4a038;
      --gold-deep: #8c5e14;
      --stage-navy: #0a1026;
      --stage-black: #03050d;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--stage-black);
      font-family: 'Poppins', 'Noto Sans Tamil', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* =========================================================================
       STAGE BACKDROP & VOLUMETRIC LIGHTING
       ========================================================================= */
    .theater-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 68% 58% at 50% 48%, rgba(212, 160, 56, 0.16) 0%, rgba(212, 160, 56, 0.04) 42%, transparent 72%),
        radial-gradient(ellipse 90% 85% at 50% 45%, #111b3d 0%, #070b1c 52%, #020308 100%);
    }

    /* Subtle dark proscenium depth vignette */
    .stage-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 35%, rgba(0, 0, 0, 0.72) 100%);
    }

    /* Twin Volumetric Sweeping Spotlights */
    .spotlight-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.75;
      transition: opacity 1.5s ease;
    }

    .theater-stage.is-open .spotlight-container {
      opacity: 1;
    }

    .spotlight-beam {
      position: absolute;
      top: -12vh;
      width: 48vw;
      max-width: 760px;
      min-width: 260px;
      height: 135vh;
      transform-origin: 50% 0%;
      background: linear-gradient(
        180deg,
        rgba(255, 240, 195, 0.28) 0%,
        rgba(248, 212, 124, 0.14) 38%,
        rgba(212, 160, 56, 0.04) 72%,
        transparent 100%
      );
      clip-path: polygon(44% 0%, 56% 0%, 100% 100%, 0% 100%);
      filter: blur(18px);
      mix-blend-mode: screen;
      will-change: transform;
    }

    .spotlight-left {
      left: -4vw;
      animation: sweepLeft 9.5s ease-in-out infinite alternate;
    }

    .spotlight-right {
      right: -4vw;
      animation: sweepRight 10.8s ease-in-out infinite alternate;
    }

    @keyframes sweepLeft {
      0% { transform: rotate(-28deg); opacity: 0.65; }
      50% { transform: rotate(-16deg); opacity: 0.92; }
      100% { transform: rotate(-24deg); opacity: 0.75; }
    }

    @keyframes sweepRight {
      0% { transform: rotate(28deg); opacity: 0.65; }
      50% { transform: rotate(15deg); opacity: 0.95; }
      100% { transform: rotate(24deg); opacity: 0.75; }
    }

    /* Subtle Stage Floor Reflection */
    .stage-floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14vh;
      min-height: 68px;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 56% 85% at 50% 0%, rgba(248, 212, 124, 0.18) 0%, rgba(212, 160, 56, 0.05) 48%, transparent 78%),
        linear-gradient(180deg, rgba(16, 12, 10, 0) 0%, rgba(14, 10, 8, 0.75) 32%, #070505 100%);
      border-top: 1px solid rgba(248, 212, 124, 0.08);
    }

    .stage-floor::after {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(248, 212, 124, 0.35), transparent);
      filter: blur(1px);
    }

    /* =========================================================================
       CENTER STAGE TITLE & GLOW RAYS
       ========================================================================= */
    .reveal-stage {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 5vw, 64px);
      text-align: center;
      pointer-events: none;
    }

    /* Animated Light Halo & Conic Rays behind the Batch Name */
    .title-aura {
      position: absolute;
      width: min(88vw, 760px);
      height: min(88vw, 760px);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 1.8s ease 0.25s, transform 2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    .theater-stage.is-open .title-aura {
      opacity: 1;
      transform: scale(1);
    }

    .title-aura::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(248, 212, 124, 0.11) 0deg 6deg,
        transparent 6deg 20deg
      );
      mask-image: radial-gradient(circle, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.25) 45%, transparent 72%);
      -webkit-mask-image: radial-gradient(circle, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.25) 45%, transparent 72%);
      animation: rotateRays 36s linear infinite;
    }

    .title-aura::after {
      content: '';
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      border: 1px solid rgba(248, 212, 124, 0.22);
      box-shadow:
        0 0 65px rgba(248, 212, 124, 0.22),
        inset 0 0 45px rgba(248, 212, 124, 0.12);
      animation: pulseRing 4.8s ease-in-out infinite;
    }

    @keyframes rotateRays {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.04); opacity: 0.95; }
    }

    /* Main Title Card Content */
    .reveal-content {
      position: relative;
      z-index: 2;
      max-width: min(92vw, 1240px);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.84) translateY(22px);
      filter: blur(8px);
      transition:
        opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.35s,
        transform 1.7s cubic-bezier(0.16, 1, 0.3, 1) 0.28s,
        filter 1.3s ease 0.3s;
      will-change: transform, opacity, filter;
    }

    .theater-stage.is-open .reveal-content {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0px);
    }

    /* Regal Top Emblem */
    .crest-emblem {
      width: clamp(54px, 7vw, 86px);
      height: auto;
      margin-bottom: clamp(10px, 1.8vh, 20px);
      filter: drop-shadow(0 0 14px rgba(248, 212, 124, 0.55));
      opacity: 0.92;
    }

    /* Crisp Golden-Ivory Metallic Tamil Batch Title */
    .batch-title-tamil {
      font-family: 'Noto Sans Tamil', sans-serif;
      font-weight: 800;
      font-size: clamp(1.75rem, 5.8vw, 5.25rem);
      line-height: 1.45;
      letter-spacing: 0.015em;
      padding: 0.18em 0.15em;
      margin: 0;
      word-break: keep-all;
      text-wrap: balance;
      background: linear-gradient(
        112deg,
        #d9a53b 0%,
        #fff9e6 22%,
        #f7d06b 40%,
        #ffffff 50%,
        #ecc054 62%,
        #fff5d1 80%,
        #c7912a 100%
      );
      background-size: 240% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 4px 12px rgba(0, 0, 0, 0.85))
        drop-shadow(0 0 28px rgba(248, 212, 124, 0.42));
      animation: goldShimmer 6.5s linear infinite;
    }

    @keyframes goldShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 240% center; }
    }

    /* Ornamental Divider Row */
    .title-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 20px);
      width: min(74vw, 440px);
      margin: clamp(8px, 1.8vh, 18px) 0 clamp(10px, 2vh, 20px);
    }

    .divider-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(248, 212, 124, 0.85), transparent);
      box-shadow: 0 0 10px rgba(248, 212, 124, 0.45);
    }

    .divider-diamond {
      width: 10px;
      height: 10px;
      background: linear-gradient(135deg, #fff8de, #d4a038);
      transform: rotate(45deg);
      box-shadow: 0 0 14px rgba(248, 212, 124, 0.9);
      flex-shrink: 0;
    }

    /* Subtitle Badge: (TUC) */
    .batch-subtitle-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.5vw, 26px);
      padding: clamp(6px, 1vw, 10px) clamp(20px, 3.4vw, 40px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(248, 212, 124, 0.11), rgba(212, 160, 56, 0.03));
      border: 1px solid rgba(248, 212, 124, 0.34);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 246, 214, 0.25);
      backdrop-filter: blur(6px);
    }

    .batch-subtitle-tuc {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(1.2rem, 3.1vw, 2.65rem);
      letter-spacing: 0.32em;
      padding-left: 0.32em; /* Optical centering for letter-spacing */
      margin: 0;
      background: linear-gradient(180deg, #fff9e3 0%, #f5cb64 55%, #b88122 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 10px rgba(248, 212, 124, 0.45));
    }

    /* =========================================================================
       RICH VELVET THEATER CURTAINS (LEFT & RIGHT)
       ========================================================================= */
    .curtains-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 51.5vw;
      will-change: transform;
      /* Deep multi-layered realistic velvet vertical pleats */
      background-color: var(--velvet-mid);
      background-image:
        /* Deep center & edge shading */
        linear-gradient(180deg, rgba(15, 0, 2, 0.62) 0%, rgba(15, 0, 2, 0.08) 20%, rgba(15, 0, 2, 0.15) 75%, rgba(15, 0, 2, 0.65) 100%),
        /* Primary large velvet drapery folds */
        repeating-linear-gradient(
          90deg,
          rgba(28, 1, 4, 0.78) 0px,
          rgba(116, 8, 20, 0.22) 18px,
          rgba(210, 42, 62, 0.22) 34px,
          rgba(148, 12, 26, 0.25) 52px,
          rgba(32, 1, 5, 0.82) 74px,
          rgba(122, 10, 22, 0.18) 92px,
          rgba(196, 34, 52, 0.18) 110px,
          rgba(26, 1, 4, 0.78) 132px
        ),
        /* Secondary finer fabric ripples */
        repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.34) 0px,
          transparent 14px,
          rgba(255, 130, 145, 0.07) 26px,
          rgba(0, 0, 0, 0.38) 44px
        ),
        /* Base crimson richness */
        linear-gradient(180deg, #5d040d 0%, #8e0817 45%, #65040e 100%);
      box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.62);
    }

    .curtain-left {
      left: 0;
      transform-origin: left top;
      border-right: 2px solid rgba(25, 0, 3, 0.85);
      box-shadow:
        inset -22px 0 38px rgba(0, 0, 0, 0.6),
        12px 0 42px rgba(0, 0, 0, 0.75);
    }

    .curtain-right {
      right: 0;
      transform-origin: right top;
      border-left: 2px solid rgba(25, 0, 3, 0.85);
      box-shadow:
        inset 22px 0 38px rgba(0, 0, 0, 0.6),
        -12px 0 42px rgba(0, 0, 0, 0.75);
    }

    /* Smooth animated sweeps when opening or springing back */
    .curtain-panel.animating-open {
      transition: transform 2.15s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .curtain-panel.animating-close {
      transition: transform 1.25s cubic-bezier(0.45, 0.05, 0.25, 1);
    }

    .curtain-panel.animating-spring {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Golden Embroidered Trim + Fringe along bottom edge of each curtain */
    .curtain-gold-trim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: clamp(22px, 3.2vh, 34px);
      background:
        /* Gold braided border band */
        linear-gradient(
          180deg,
          #6f4508 0%,
          #f6d379 18%,
          #b87f1e 38%,
          #ffebaa 52%,
          #8b5910 70%,
          transparent 72%
        ),
        /* Gold fringe strands along very bottom */
        repeating-linear-gradient(
          90deg,
          #d4a038 0px,
          #f8dc8c 3px,
          #754c0b 5px,
          transparent 7px
        );
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.55);
      opacity: 0.94;
    }

    /* Subtle gold vertical edge piping along the meeting seam */
    .curtain-left::after,
    .curtain-right::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: clamp(20px, 3vh, 32px);
      width: 5px;
      background: linear-gradient(180deg, #8b5b10, #f7d57c 30%, #c48c25 65%, #f5cf70 88%, #7c500d);
      opacity: 0.65;
    }

    .curtain-left::after { right: 0; }
    .curtain-right::after { left: 0; }

    /* =========================================================================
       ORNATE TOP VALANCE (PELMET)
       ========================================================================= */
    .valance-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(64px, 11vh, 118px);
      z-index: 30;
      pointer-events: none;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.78));
    }

    .valance-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================================================================
       INTERACTIVE BRAIDED GOLDEN SILK PULL-ROPE & TASSEL
       ========================================================================= */
    .rope-anchor {
      position: absolute;
      top: -120px; /* Extra rope length hidden behind valance for smooth downward pull */
      right: clamp(18px, 6.2vw, 78px);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
      will-change: transform, opacity;
      transform-origin: 50% 0%;
      transition: opacity 0.8s ease;
    }

    .rope-anchor:active {
      cursor: grabbing;
    }

    .rope-anchor.spring-back {
      transition: transform 0.62s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .rope-anchor.auto-pulling {
      transition: transform 0.55s cubic-bezier(0.32, 0, 0.67, 0);
    }

    .rope-anchor.is-retracted {
      pointer-events: none;
      opacity: 0;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s ease 0.25s;
    }

    /* Generous accessible grab zone for both touch and mouse */
    .rope-hit-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 28px 34px 28px;
      outline: none;
    }

    .rope-hit-area:focus-visible .tassel-svg {
      filter: drop-shadow(0 0 18px rgba(255, 224, 130, 0.95));
    }

    /* Braided Golden Silk Cord */
    .golden-cord {
      width: 13px;
      height: clamp(280px, 44vh, 430px);
      border-radius: 6px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 245, 200, 0.85) 0px,
          rgba(218, 165, 52, 0.95) 4px,
          rgba(118, 72, 10, 0.95) 8px,
          rgba(246, 208, 112, 0.92) 12px
        ),
        repeating-linear-gradient(
          -45deg,
          rgba(255, 238, 175, 0.45) 0px,
          rgba(120, 72, 12, 0.55) 6px,
          rgba(232, 184, 72, 0.5) 12px
        );
      box-shadow:
        inset 2px 0 3px rgba(255, 250, 220, 0.65),
        inset -2px 0 4px rgba(80, 45, 5, 0.85),
        4px 8px 18px rgba(0, 0, 0, 0.65);
    }

    /* Detailed Golden Knot & Weighted Tassel */
    .tassel-wrapper {
      margin-top: -4px;
      transform-origin: 50% 4px;
      animation: gentleTasselSway 3.8s ease-in-out infinite;
    }

    .rope-anchor.is-dragging .tassel-wrapper {
      animation: none;
    }

    @keyframes gentleTasselSway {
      0%, 100% { transform: rotate(-1.8deg); }
      50% { transform: rotate(1.8deg); }
    }

    .tassel-svg {
      width: clamp(46px, 5.4vw, 60px);
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.72));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .rope-hit-area:hover .tassel-svg {
      transform: scale(1.05);
      filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.78)) drop-shadow(0 0 14px rgba(248, 212, 124, 0.5));
    }

    /* Subtle Pulsing Pull Prompt near Tassel */
    .pull-prompt {
      position: absolute;
      top: calc(100% - 140px);
      right: calc(100% - 10px);
      width: max-content;
      max-width: 210px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(14, 6, 8, 0.74);
      border: 1px solid rgba(248, 212, 124, 0.45);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.6), 0 0 18px rgba(248, 212, 124, 0.16);
      backdrop-filter: blur(8px);
      color: #fff3d1;
      font-size: clamp(0.78rem, 1.5vw, 0.9rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s ease, transform 0.4s ease;
      animation: promptPulse 2.4s ease-in-out infinite;
    }

    .pull-prompt.is-hidden {
      opacity: 0 !important;
      transform: translateY(8px) scale(0.95);
      animation: none;
    }

    .pull-prompt-arrow {
      display: inline-flex;
      color: #f8d47c;
      animation: arrowBounce 1.4s ease-in-out infinite;
    }

    @keyframes promptPulse {
      0%, 100% { opacity: 0.82; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 12px rgba(248, 212, 124, 0.18); }
      50% { opacity: 1; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65), 0 0 22px rgba(248, 212, 124, 0.42); }
    }

    @keyframes arrowBounce {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(4px); }
    }

    /* Pull Progress Ring Indicator (subtle visual cue while dragging) */
    .pull-meter {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .rope-anchor.is-dragging .pull-meter {
      opacity: 1;
    }

    .pull-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4a038, #fff3c4);
      border-radius: 999px;
    }

    /* Mobile adjustment for prompt so it never clips off-screen */
    @media (max-width: 640px) {
      .pull-prompt {
        right: calc(100% - 14px);
        padding: 8px 13px;
        font-size: 0.78rem;
      }
      .golden-cord {
        width: 11px;
        height: clamp(235px, 40vh, 330px);
      }
    }

    /* =========================================================================
       HTML5 PARTICLE CANVASES
       ========================================================================= */
    .particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ambient-canvas {
      z-index: 4;
    }

    #celebration-canvas {
      z-index: 35;
    }

    /* =========================================================================
       MINIMAL GLASSMORPHIC UTILITY CONTROLS (BOTTOM-RIGHT)
       ========================================================================= */
    .utility-controls {
      position: fixed;
      right: clamp(12px, 2vw, 24px);
      bottom: clamp(12px, 2vh, 22px);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.28;
      transition: opacity 0.35s ease;
    }

    .utility-controls:hover,
    .utility-controls:focus-within {
      opacity: 1;
    }

    /* Slightly higher baseline visibility on touch devices where hover isn't persistent */
    @media (hover: none) {
      .utility-controls {
        opacity: 0.48;
      }
      .utility-controls:active {
        opacity: 1;
      }
    }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      min-width: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(12, 14, 24, 0.56);
      border: 1px solid rgba(248, 212, 124, 0.32);
      color: #f9e6b3;
      font-size: 0.8rem;
      font-weight: 500;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      transition:
        background-color 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s ease,
        opacity 0.35s ease;
    }

    .glass-btn:hover {
      background: rgba(28, 24, 18, 0.82);
      border-color: rgba(248, 212, 124, 0.72);
      color: #fff9e5;
      transform: translateY(-1px);
    }

    .glass-btn:active {
      transform: scale(0.95);
    }

    .glass-btn.is-hidden {
      display: none;
    }

    /* Non-intrusive Status Toast (replaces any browser alert) */
    .stage-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      z-index: 70;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(12, 14, 24, 0.86);
      border: 1px solid rgba(248, 212, 124, 0.45);
      color: #fff4d6;
      font-size: 0.82rem;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .stage-toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <!-- =======================================================================
       THEATER INTERACTION, WEB AUDIO SYNTHESIS & 60FPS PARTICLE ENGINE
       ======================================================================= -->
  <script>
    (function () {
      'use strict';

      /* ---------------------------------------------------------------------
         DOM REFERENCES & APPLICATION STATE
         --------------------------------------------------------------------- */
      const stageEl = document.getElementById('theaterStage');
      const curtainLeft = document.getElementById('curtainLeft');
      const curtainRight = document.getElementById('curtainRight');
      const ropeAnchor = document.getElementById('ropeAnchor');
      const ropeHitArea = document.getElementById('ropeHitArea');
      const tasselWrapper = document.getElementById('tasselWrapper');
      const pullPrompt = document.getElementById('pullPrompt');
      const pullMeterFill = document.getElementById('pullMeterFill');
      const revealContent = document.getElementById('revealContent');

      const resetBtn = document.getElementById('resetBtn');
      const muteBtn = document.getElementById('muteBtn');
      const iconSoundOn = document.getElementById('iconSoundOn');
      const iconSoundOff = document.getElementById('iconSoundOff');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const iconFsEnter = document.getElementById('iconFsEnter');
      const iconFsExit = document.getElementById('iconFsExit');
      const stageToast = document.getElementById('stageToast');

      const ambientCanvas = document.getElementById('ambient-canvas');
      const ambientCtx = ambientCanvas.getContext('2d');
      const celebrationCanvas = document.getElementById('celebration-canvas');
      const celebrationCtx = celebrationCanvas.getContext('2d');

      const state = {
        isOpen: false,
        isAnimating: false,
        isDragging: false,
        isMuted: false,
        pointerId: null,
        startY: 0,
        startX: 0,
        startTime: 0,
        currentPullY: 0,
        currentTilt: 0,
        maxMovedDist: 0,
        toastTimer: null
      };

      /* ---------------------------------------------------------------------
         NON-INTRUSIVE TOAST HELPER
         --------------------------------------------------------------------- */
      function showToast(message) {
        if (state.toastTimer) clearTimeout(state.toastTimer);
        stageToast.textContent = message;
        stageToast.classList.add('is-visible');
        state.toastTimer = setTimeout(() => {
          stageToast.classList.remove('is-visible');
        }, 2400);
      }

      /* ---------------------------------------------------------------------
         WEB AUDIO API THEATRICAL SOUND SYNTHESIZER (ZERO EXTERNAL ASSETS)
         --------------------------------------------------------------------- */
      const SoundEngine = {
        ctx: null,
        masterGain: null,

        init() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return false;
              this.ctx = new AudioCtx();
              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.value = state.isMuted ? 0 : 0.78;
              this.masterGain.connect(this.ctx.destination);
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return true;
          } catch (err) {
            console.warn('Web Audio initialization skipped:', err);
            return false;
          }
        },

        setMuted(muted) {
          if (this.masterGain && this.ctx) {
            this.masterGain.gain.setTargetAtTime(muted ? 0 : 0.78, this.ctx.currentTime, 0.04);
          }
        },

        /**
         * Creates a reusable pink-ish noise buffer for soft velvet fabric whoosh.
         */
        createNoiseBuffer(durationSec) {
          const sampleRate = this.ctx.sampleRate;
          const length = Math.floor(sampleRate * durationSec);
          const buffer = this.ctx.createBuffer(2, length, sampleRate);
          for (let ch = 0; ch < 2; ch++) {
            const data = buffer.getChannelData(ch);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < length; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
              b6 = white * 0.115926;
            }
          }
          return buffer;
        },

        /**
         * Grand Reveal Audio: Velvet Curtain Whoosh + Warm Orchestral Swell + Golden Chimes
         */
        playGrandReveal() {
          if (state.isMuted || !this.init()) return;
          try {
            const now = this.ctx.currentTime;

            // 1. Theatrical Velvet Curtain Whoosh
            const noiseSrc = this.ctx.createBufferSource();
            noiseSrc.buffer = this.createNoiseBuffer(2.1);

            const bandpass = this.ctx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.setValueAtTime(160, now);
            bandpass.frequency.exponentialRampToValueAtTime(920, now + 0.55);
            bandpass.frequency.exponentialRampToValueAtTime(260, now + 1.9);
            bandpass.Q.value = 1.1;

            const whooshGain = this.ctx.createGain();
            whooshGain.gain.setValueAtTime(0.001, now);
            whooshGain.gain.linearRampToValueAtTime(0.45, now + 0.35);
            whooshGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

            noiseSrc.connect(bandpass);
            bandpass.connect(whooshGain);
            whooshGain.connect(this.masterGain);
            noiseSrc.start(now);
            noiseSrc.stop(now + 2.05);

            // 2. Warm Celebratory Orchestral Major-9th Chord Swell (C major 9)
            const chordFreqs = [130.81, 196.00, 261.63, 329.63, 392.00, 493.88, 587.33];
            const chordFilter = this.ctx.createBiquadFilter();
            chordFilter.type = 'lowpass';
            chordFilter.frequency.setValueAtTime(280, now + 0.12);
            chordFilter.frequency.exponentialRampToValueAtTime(2600, now + 1.35);
            chordFilter.frequency.exponentialRampToValueAtTime(950, now + 4.4);
            chordFilter.Q.value = 0.8;

            const chordGain = this.ctx.createGain();
            chordGain.gain.setValueAtTime(0.0001, now + 0.1);
            chordGain.gain.linearRampToValueAtTime(0.24, now + 0.95);
            chordGain.gain.exponentialRampToValueAtTime(0.0008, now + 4.8);

            chordFilter.connect(chordGain);
            chordGain.connect(this.masterGain);

            chordFreqs.forEach((freq, idx) => {
              // Dual slightly detuned oscillators for lush auditorium string/brass warmth
              [-5, 5].forEach((detuneCents) => {
                const osc = this.ctx.createOscillator();
                osc.type = idx < 2 ? 'triangle' : 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + 0.12);
                osc.detune.setValueAtTime(detuneCents, now + 0.12);

                const voiceGain = this.ctx.createGain();
                voiceGain.gain.value = idx < 2 ? 0.24 : 0.11;

                osc.connect(voiceGain);
                voiceGain.connect(chordFilter);
                osc.start(now + 0.12);
                osc.stop(now + 4.9);
              });
            });

            // 3. Cascading Golden Chime / Harp Shimmer Arpeggio
            const shimmerNotes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1174.66, 1318.51, 1567.98, 2093.00];
            shimmerNotes.forEach((freq, i) => {
              const t = now + 0.36 + i * 0.085;
              const chimeOsc = this.ctx.createOscillator();
              const harmonicOsc = this.ctx.createOscillator();
              const chimeGain = this.ctx.createGain();

              chimeOsc.type = 'sine';
              chimeOsc.frequency.setValueAtTime(freq, t);

              harmonicOsc.type = 'triangle';
              harmonicOsc.frequency.setValueAtTime(freq * 2, t);

              const hGain = this.ctx.createGain();
              hGain.gain.value = 0.22;

              chimeGain.gain.setValueAtTime(0.0001, t);
              chimeGain.gain.linearRampToValueAtTime(0.095, t + 0.02);
              chimeGain.gain.exponentialRampToValueAtTime(0.0005, t + 2.1);

              chimeOsc.connect(chimeGain);
              harmonicOsc.connect(hGain);
              hGain.connect(chimeGain);
              chimeGain.connect(this.masterGain);

              chimeOsc.start(t);
              harmonicOsc.start(t);
              chimeOsc.stop(t + 2.2);
              harmonicOsc.stop(t + 2.2);
            });
          } catch (err) {
            console.warn('Reveal audio playback error:', err);
          }
        },

        /**
         * Gentle Soft Whoosh when closing the curtains back
         */
        playCurtainClose() {
          if (state.isMuted || !this.init()) return;
          try {
            const now = this.ctx.currentTime;
            const noiseSrc = this.ctx.createBufferSource();
            noiseSrc.buffer = this.createNoiseBuffer(1.2);

            const lp = this.ctx.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.setValueAtTime(650, now);
            lp.frequency.exponentialRampToValueAtTime(160, now + 1.1);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.24, now + 0.25);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 1.15);

            noiseSrc.connect(lp);
            lp.connect(gain);
            gain.connect(this.masterGain);

            noiseSrc.start(now);
            noiseSrc.stop(now + 1.2);
          } catch (err) {
            console.warn('Close audio playback error:', err);
          }
        }
      };

      /* ---------------------------------------------------------------------
         HTML5 CANVAS PARTICLE SYSTEMS (AMBIENT GOLD DUST + CONFETTI BURST)
         --------------------------------------------------------------------- */
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const dustMotes = [];
      const confettiParticles = [];
      const sparkleParticles = [];

      const CONFETTI_COLORS = [
        '#fff6d6',
        '#f8d47c',
        '#e5b142',
        '#c78d20',
        '#ffd984',
        '#b81427'
      ];

      function resizeCanvases() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        [ambientCanvas, celebrationCanvas].forEach((canvas) => {
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
        });

        ambientCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        celebrationCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function initAmbientDust() {
        dustMotes.length = 0;
        const count = width < 640 ? 34 : 58;
        for (let i = 0; i < count; i++) {
          dustMotes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: 0.8 + Math.random() * 2.2,
            speedY: -(0.14 + Math.random() * 0.36),
            driftAmp: 0.25 + Math.random() * 0.65,
            phase: Math.random() * Math.PI * 2,
            alphaBase: 0.22 + Math.random() * 0.55
          });
        }
      }

      /**
       * Launches celebratory golden confetti ribbons & starlight sparkles
       */
      function triggerCelebrationBurst() {
        const isMobile = width < 640;
        const confettiCount = isMobile ? 90 : 150;
        const sparkleCount = isMobile ? 38 : 65;

        // Dual side cannons + center shower
        for (let i = 0; i < confettiCount; i++) {
          const originMode = i % 3;
          let startX, startY, vx, vy;

          if (originMode === 0) {
            // Left wing burst
            startX = width * 0.14;
            startY = height * 0.56;
            const angle = -Math.PI / 3 + (Math.random() - 0.5) * 0.9;
            const speed = (isMobile ? 7 : 10) + Math.random() * 10;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed - 2;
          } else if (originMode === 1) {
            // Right wing burst
            startX = width * 0.86;
            startY = height * 0.56;
            const angle = -Math.PI * (2 / 3) + (Math.random() - 0.5) * 0.9;
            const speed = (isMobile ? 7 : 10) + Math.random() * 10;
            vx = Math.cos(angle) * speed;
            vy = Math.sin(angle) * speed - 2;
          } else {
            // Overhead theatrical canopy drop
            startX = width * (0.15 + Math.random() * 0.7);
            startY = -10 - Math.random() * 60;
            vx = (Math.random() - 0.5) * 3.5;
            vy = 1.5 + Math.random() * 3.5;
          }

          confettiParticles.push({
            x: startX,
            y: startY,
            vx,
            vy,
            sizeW: 6 + Math.random() * 7,
            sizeH: 4 + Math.random() * 5,
            color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.18,
            tiltPhase: Math.random() * Math.PI * 2,
            tiltSpeed: 0.08 + Math.random() * 0.1,
            gravity: 0.11 + Math.random() * 0.07,
            drag: 0.985,
            alpha: 1,
            life: 0,
            maxLife: 240 + Math.random() * 140
          });
        }

        // Radial Golden Star Sparkles from center spotlight
        for (let i = 0; i < sparkleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.8 + Math.random() * (isMobile ? 6.5 : 10.5);
          sparkleParticles.push({
            x: width * 0.5 + (Math.random() - 0.5) * 60,
            y: height * 0.48 + (Math.random() - 0.5) * 40,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.8,
            radius: 2 + Math.random() * 4.5,
            alpha: 1,
            decay: 0.01 + Math.random() * 0.012,
            twinklePhase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawFourPointStar(ctx, x, y, radius, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = `rgba(255, 244, 200, ${alpha})`;
        ctx.shadowColor = 'rgba(248, 212, 124, 0.9)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          const angle = (i * Math.PI) / 2;
          const nextAngle = angle + Math.PI / 4;
          ctx.lineTo(Math.cos(angle) * radius * 2.1, Math.sin(angle) * radius * 2.1);
          ctx.lineTo(Math.cos(nextAngle) * radius * 0.45, Math.sin(nextAngle) * radius * 0.45);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function animateParticles(time) {
        // 1. Render Ambient Floating Gold Dust behind curtains
        ambientCtx.clearRect(0, 0, width, height);
        const tSec = time * 0.001;

        for (let i = 0; i < dustMotes.length; i++) {
          const m = dustMotes[i];
          m.y += m.speedY;
          m.x += Math.sin(tSec * 0.8 + m.phase) * m.driftAmp;

          if (m.y < -10) {
            m.y = height + 10;
            m.x = Math.random() * width;
          }
          if (m.x < -10) m.x = width + 10;
          if (m.x > width + 10) m.x = -10;

          const twinkle = 0.55 + 0.45 * Math.sin(tSec * 2.1 + m.phase);
          const alpha = m.alphaBase * twinkle;

          ambientCtx.beginPath();
          ambientCtx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ambientCtx.fillStyle = `rgba(252, 224, 146, ${alpha})`;
          ambientCtx.fill();
        }

        // 2. Render Celebratory Confetti & Sparkles (only when active)
        if (confettiParticles.length > 0 || sparkleParticles.length > 0) {
          celebrationCtx.clearRect(0, 0, width, height);

          for (let i = confettiParticles.length - 1; i >= 0; i--) {
            const p = confettiParticles[i];
            p.life++;
            p.vx *= p.drag;
            p.vy = p.vy * p.drag + p.gravity;
            p.x += p.vx + Math.sin(p.tiltPhase) * 0.65;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.tiltPhase += p.tiltSpeed;

            if (p.life > p.maxLife * 0.72) {
              p.alpha = Math.max(0, 1 - (p.life - p.maxLife * 0.72) / (p.maxLife * 0.28));
            }

            if (p.y > height + 30 || p.life >= p.maxLife || p.alpha <= 0.01) {
              confettiParticles.splice(i, 1);
              continue;
            }

            celebrationCtx.save();
            celebrationCtx.translate(p.x, p.y);
            celebrationCtx.rotate(p.rotation);
            celebrationCtx.scale(1, Math.cos(p.tiltPhase));
            celebrationCtx.globalAlpha = p.alpha;
            celebrationCtx.fillStyle = p.color;
            celebrationCtx.fillRect(-p.sizeW / 2, -p.sizeH / 2, p.sizeW, p.sizeH);
            celebrationCtx.restore();
          }

          for (let i = sparkleParticles.length - 1; i >= 0; i--) {
            const s = sparkleParticles[i];
            s.vx *= 0.96;
            s.vy *= 0.96;
            s.x += s.vx;
            s.y += s.vy;
            s.alpha -= s.decay;
            s.twinklePhase += 0.25;

            if (s.alpha <= 0.02) {
              sparkleParticles.splice(i, 1);
              continue;
            }

            const pulse = 0.65 + 0.35 * Math.sin(s.twinklePhase);
            drawFourPointStar(celebrationCtx, s.x, s.y, s.radius * pulse, s.alpha);
          }
        } else {
          celebrationCtx.clearRect(0, 0, width, height);
        }

        requestAnimationFrame(animateParticles);
      }

      /* ---------------------------------------------------------------------
         CURTAIN & ROPE PHYSICS LOGIC
         --------------------------------------------------------------------- */

      /**
       * Pull threshold (~120px on desktop, ~18-20% viewport height on smaller screens)
       */
      function getPullThreshold() {
        return Math.min(130, Math.max(88, Math.round(window.innerHeight * 0.19)));
      }

      /**
       * Updates curtain peek & rope position smoothly during live manual pull
       */
      function applyManualPullVisuals(pullY, tiltDeg) {
        const threshold = getPullThreshold();
        const progress = Math.min(1, Math.max(0, pullY / threshold));

        // Move rope down smoothly and tilt slightly toward horizontal drag
        ropeAnchor.style.transform = `translate3d(0, ${pullY.toFixed(1)}px, 0) rotate(${tiltDeg.toFixed(2)}deg)`;
        tasselWrapper.style.transform = `rotate(${(-tiltDeg * 1.4).toFixed(2)}deg)`;

        // Progress bar indicator
        pullMeterFill.style.width = `${Math.round(progress * 100)}%`;

        // Curtains peek open proportionally to pull progress (up to ~18% viewport width before latch triggers)
        const peekVw = progress * 16.5;
        const squeezeX = 1 - progress * 0.08;
        curtainLeft.style.transform = `translate3d(-${peekVw.toFixed(2)}vw, 0, 0) scaleX(${squeezeX.toFixed(4)})`;
        curtainRight.style.transform = `translate3d(${peekVw.toFixed(2)}vw, 0, 0) scaleX(${squeezeX.toFixed(4)})`;

        // Subtle teaser glow on center title as curtains part
        if (progress > 0.1) {
          revealContent.style.transition = 'none';
          revealContent.style.opacity = (progress * 0.38).toFixed(3);
          revealContent.style.transform = `scale(${(0.84 + progress * 0.06).toFixed(3)}) translateY(${(22 - progress * 10).toFixed(1)}px)`;
          revealContent.style.filter = `blur(${(8 - progress * 4).toFixed(1)}px)`;
        }
      }

      /**
       * Springs the rope and curtains cleanly back if released before threshold
       */
      function springBack() {
        state.isDragging = false;
        state.currentPullY = 0;
        state.currentTilt = 0;

        ropeAnchor.classList.remove('is-dragging');
        ropeAnchor.classList.add('spring-back');
        ropeAnchor.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
        tasselWrapper.style.transform = '';
        pullMeterFill.style.width = '0%';

        curtainLeft.classList.add('animating-spring');
        curtainRight.classList.add('animating-spring');
        curtainLeft.style.transform = 'translate3d(0, 0, 0) scaleX(1)';
        curtainRight.style.transform = 'translate3d(0, 0, 0) scaleX(1)';

        // Reset inline teaser styles on title
        revealContent.style.transition = '';
        revealContent.style.opacity = '';
        revealContent.style.transform = '';
        revealContent.style.filter = '';

        setTimeout(() => {
          ropeAnchor.classList.remove('spring-back');
          curtainLeft.classList.remove('animating-spring');
          curtainRight.classList.remove('animating-spring');
        }, 680);
      }

      /**
       * Triggers the Full Grand Curtain Opening & Celebration
       */
      function triggerGrandOpen() {
        if (state.isOpen) return;
        state.isOpen = true;
        state.isDragging = false;
        state.isAnimating = true;

        // Hide prompt & retract rope gracefully
        pullPrompt.classList.add('is-hidden');
        ropeAnchor.classList.remove('is-dragging', 'spring-back', 'auto-pulling');
        ropeAnchor.classList.add('is-retracted');
        ropeAnchor.style.transform = `translate3d(38px, -110px, 0)`;

        // Clear any manual inline title overrides so the grand CSS reveal transition plays smoothly
        revealContent.style.transition = '';
        revealContent.style.opacity = '';
        revealContent.style.transform = '';
        revealContent.style.filter = '';

        // Sweep curtains dramatically apart, leaving lush draped velvet framing edges
        curtainLeft.classList.remove('animating-spring', 'animating-close');
        curtainRight.classList.remove('animating-spring', 'animating-close');
        curtainLeft.classList.add('animating-open');
        curtainRight.classList.add('animating-open');

        // Leave ~8-10% draped framing edges on desktop and ~6% on compact screens
        const openTranslate = width < 640 ? 44.5 : 42.5;
        curtainLeft.style.transform = `translate3d(-${openTranslate}vw, 0, 0) scaleX(0.76)`;
        curtainRight.style.transform = `translate3d(${openTranslate}vw, 0, 0) scaleX(0.76)`;

        // Activate Stage Reveal (title scale/fade, spotlight boost, golden aura)
        stageEl.classList.add('is-open');

        // Play synthesized theatrical sound & launch confetti burst
        SoundEngine.playGrandReveal();
        setTimeout(() => {
          triggerCelebrationBurst();
        }, 260);

        // Reveal the Close Curtains / Replay button
        setTimeout(() => {
          resetBtn.classList.remove('is-hidden');
          state.isAnimating = false;
        }, 1200);
      }

      /**
       * Accessible Click / Tap / Keyboard fallback: animates rope pulling down automatically
       */
      function triggerAutoPullAndOpen() {
        if (state.isOpen || state.isAnimating) return;
        state.isAnimating = true;
        SoundEngine.init();

        const threshold = getPullThreshold();
        pullPrompt.classList.add('is-hidden');
        ropeAnchor.classList.remove('spring-back');
        ropeAnchor.classList.add('auto-pulling');
        ropeAnchor.style.transform = `translate3d(0, ${threshold + 18}px, 0)`;

        // Slight curtain peek while auto-pulling
        curtainLeft.classList.add('animating-spring');
        curtainRight.classList.add('animating-spring');
        curtainLeft.style.transform = 'translate3d(-10vw, 0, 0) scaleX(0.95)';
        curtainRight.style.transform = 'translate3d(10vw, 0, 0) scaleX(0.95)';

        setTimeout(() => {
          triggerGrandOpen();
        }, 460);
      }

      /**
       * Resets the stage smoothly so the reveal can be replayed during rehearsals/events
       */
      function resetStage() {
        if (!state.isOpen && !state.isAnimating) return;
        state.isOpen = false;
        state.isAnimating = true;

        SoundEngine.playCurtainClose();
        resetBtn.classList.add('is-hidden');
        stageEl.classList.remove('is-open');

        curtainLeft.classList.remove('animating-open', 'animating-spring');
        curtainRight.classList.remove('animating-open', 'animating-spring');
        curtainLeft.classList.add('animating-close');
        curtainRight.classList.add('animating-close');

        curtainLeft.style.transform = 'translate3d(0, 0, 0) scaleX(1)';
        curtainRight.style.transform = 'translate3d(0, 0, 0) scaleX(1)';

        setTimeout(() => {
          ropeAnchor.classList.remove('is-retracted', 'auto-pulling');
          ropeAnchor.classList.add('spring-back');
          ropeAnchor.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
          tasselWrapper.style.transform = '';
          pullMeterFill.style.width = '0%';
          pullPrompt.classList.remove('is-hidden');
        }, 720);

        setTimeout(() => {
          curtainLeft.classList.remove('animating-close');
          curtainRight.classList.remove('animating-close');
          ropeAnchor.classList.remove('spring-back');
          state.isAnimating = false;
        }, 1350);
      }

      /* ---------------------------------------------------------------------
         POINTER EVENT HANDLERS (UNIFIED MOUSE DRAG + MOBILE TOUCH)
         --------------------------------------------------------------------- */
      ropeHitArea.addEventListener('pointerdown', (e) => {
        if (state.isOpen || state.isAnimating) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        // Unlock Web Audio context immediately on user interaction
        SoundEngine.init();

        state.isDragging = true;
        state.pointerId = e.pointerId;
        state.startY = e.clientY;
        state.startX = e.clientX;
        state.startTime = performance.now();
        state.currentPullY = 0;
        state.currentTilt = 0;
        state.maxMovedDist = 0;

        ropeAnchor.classList.remove('spring-back', 'auto-pulling');
        ropeAnchor.classList.add('is-dragging');
        curtainLeft.classList.remove('animating-spring', 'animating-open', 'animating-close');
        curtainRight.classList.remove('animating-spring', 'animating-open', 'animating-close');

        try {
          ropeHitArea.setPointerCapture(e.pointerId);
        } catch (_) {
          // Ignore pointer capture errors in restricted frames
        }
      });

      ropeHitArea.addEventListener('pointermove', (e) => {
        if (!state.isDragging || e.pointerId !== state.pointerId || state.isOpen) return;

        const rawDeltaY = e.clientY - state.startY;
        const rawDeltaX = e.clientX - state.startX;
        const movedDist = Math.hypot(rawDeltaX, rawDeltaY);
        if (movedDist > state.maxMovedDist) state.maxMovedDist = movedDist;

        // Hide prompt once user meaningfully starts pulling
        if (rawDeltaY > 18) {
          pullPrompt.classList.add('is-hidden');
        }

        // Tactile elastic resistance for downward pull
        const clampedY = Math.max(0, rawDeltaY);
        const dampedY = clampedY <= 120
          ? clampedY * 0.92
          : 120 * 0.92 + (clampedY - 120) * 0.45;

        // Subtle horizontal pendulum swing angle
        const tiltDeg = Math.max(-7.5, Math.min(7.5, -rawDeltaX * 0.045));

        state.currentPullY = dampedY;
        state.currentTilt = tiltDeg;

        applyManualPullVisuals(dampedY, tiltDeg);

        // Immediately trigger grand reveal once pulled past threshold!
        const threshold = getPullThreshold();
        if (dampedY >= threshold) {
          try {
            ropeHitArea.releasePointerCapture(e.pointerId);
          } catch (_) {}
          triggerGrandOpen();
        }
      });

      function handlePointerRelease(e) {
        if (!state.isDragging || (e.pointerId !== undefined && e.pointerId !== state.pointerId)) return;

        try {
          if (state.pointerId !== null) {
            ropeHitArea.releasePointerCapture(state.pointerId);
          }
        } catch (_) {}

        const elapsed = performance.now() - state.startTime;
        const wasQuickTap = state.maxMovedDist < 12 && elapsed < 380;

        if (!state.isOpen) {
          if (wasQuickTap) {
            // Accessible click/tap fallback: animate rope pull & open curtains
            state.isDragging = false;
            ropeAnchor.classList.remove('is-dragging');
            triggerAutoPullAndOpen();
          } else {
            // Released before reaching threshold: spring smoothly back up
            pullPrompt.classList.remove('is-hidden');
            springBack();
          }
        }
      }

      ropeHitArea.addEventListener('pointerup', handlePointerRelease);
      ropeHitArea.addEventListener('pointercancel', handlePointerRelease);

      // Keyboard Accessibility (Enter or Space on rope)
      ropeHitArea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          triggerAutoPullAndOpen();
        }
      });

      /* ---------------------------------------------------------------------
         UTILITY BUTTON HANDLERS (RESET, MUTE, FULLSCREEN)
         --------------------------------------------------------------------- */
      resetBtn.addEventListener('click', resetStage);

      muteBtn.addEventListener('click', () => {
        state.isMuted = !state.isMuted;
        SoundEngine.setMuted(state.isMuted);
        muteBtn.setAttribute('aria-pressed', String(state.isMuted));
        iconSoundOn.classList.toggle('hidden', state.isMuted);
        iconSoundOff.classList.toggle('hidden', !state.isMuted);
        showToast(state.isMuted ? 'Sound Muted' : 'Sound Enabled');
      });

      function updateFullscreenIcons() {
        const isFs = Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.msFullscreenElement
        );
        iconFsEnter.classList.toggle('hidden', isFs);
        iconFsExit.classList.toggle('hidden', !isFs);
      }

      fullscreenBtn.addEventListener('click', async () => {
        try {
          const docEl = document.documentElement;
          const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
          if (!isFs) {
            if (docEl.requestFullscreen) {
              await docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
              docEl.webkitRequestFullscreen();
            } else {
              showToast('Fullscreen is not supported on this browser');
            }
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        } catch (err) {
          showToast('Fullscreen blocked by embedded preview frame');
        }
      });

      document.addEventListener('fullscreenchange', updateFullscreenIcons);
      document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

      /* ---------------------------------------------------------------------
         INITIALIZATION & RESIZE HANDLING
         --------------------------------------------------------------------- */
      window.addEventListener('resize', () => {
        resizeCanvases();
        initAmbientDust();
        // Keep open curtains smoothly aligned if screen rotates or enters fullscreen
        if (state.isOpen) {
          const openTranslate = window.innerWidth < 640 ? 44.5 : 42.5;
          curtainLeft.style.transform = `translate3d(-${openTranslate}vw, 0, 0) scaleX(0.76)`;
          curtainRight.style.transform = `translate3d(${openTranslate}vw, 0, 0) scaleX(0.76)`;
        }
      });

      window.addEventListener('load', () => {
        resizeCanvases();
        initAmbientDust();
        requestAnimationFrame(animateParticles);
      });
    })();
  </script>
</body>
</html>
